<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Museo Bagatti Valsecchi - WebAR Experience</title>
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#c4a45d">

  <!-- iOS support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BagattiAR">
  <link rel="apple-touch-icon" href="./asset/icons/pwa-icon-192.png">

  <script>
    // In test locale / tunnel: disattiva SW (cache spesso causa schermata bianca)
    const isDevHost = /^(localhost|127\.|192\.168\.|10\.|.*\.ngrok)/i.test(location.hostname)
      || location.hostname.endsWith('.ngrok-free.dev')
      || location.hostname.endsWith('.ngrok.io')
      || location.hostname.endsWith('.trycloudflare.com')
      || location.hostname.endsWith('.loca.lt');
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        if (isDevHost) {
          navigator.serviceWorker.getRegistrations()
            .then((regs) => Promise.all(regs.map((r) => r.unregister())))
            .then(() => caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k)))))
            .then(() => console.log('🧹 SW disattivato (dev/tunnel)'))
            .catch(() => {});
          return;
        }
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ Service Worker registrato!', reg))
          .catch(err => console.log('❌ Registrazione Service Worker fallita:', err));
      });
    }

    // Boot XR: usa il banner di recovery (stesso stile PWA). Bundle raffina lingua/copy.
    (function () {
      let softTimer = null;
      let hardTimer = null;

      function bannerEls() {
        return {
          banner: document.getElementById('error-recovery-banner'),
          title: document.getElementById('error-recovery-title'),
          msg: document.getElementById('error-recovery-msg'),
          reload: document.getElementById('error-reload-btn'),
          close: document.getElementById('error-close-btn'),
        };
      }

      function showEarlyXrBanner(detail) {
        if (window.XR8) return;
        // Se il hub TS è già attivo, delega
        if (window.ErrorRecovery && typeof window.ErrorRecovery.reportXrBoot === 'function') {
          window.ErrorRecovery.reportXrBoot(detail);
          return;
        }
        const { banner, title, msg, reload, close } = bannerEls();
        if (!banner) return;
        if (title) title.textContent = 'Esperienza AR in avvio';
        if (msg) {
          msg.textContent = detail
            || 'Il motore di realtà aumentata non è ancora pronto. Attendi oppure ricarica la pagina.';
        }
        if (reload) {
          reload.textContent = 'Ricarica';
          reload.onclick = () => location.reload();
        }
        if (close) {
          close.textContent = 'Chiudi';
          close.onclick = () => banner.classList.add('hidden');
        }
        banner.classList.remove('hidden');
      }

      function clearEarly() {
        if (softTimer) clearTimeout(softTimer);
        if (hardTimer) clearTimeout(hardTimer);
        softTimer = hardTimer = null;
        if (window.XR8) {
          const b = document.getElementById('error-recovery-banner');
          // Non chiudere altri tipi di errore gestiti dal hub
          if (b && !window.ErrorRecovery) b.classList.add('hidden');
        }
      }

      window.addEventListener('xrloaded', clearEarly);
      const poll = setInterval(() => {
        if (window.XR8) {
          clearInterval(poll);
          clearEarly();
        }
      }, 500);

      window.addEventListener('load', () => {
        softTimer = setTimeout(() => showEarlyXrBanner('Download motore AR ancora in corso…'), 15000);
        hardTimer = setTimeout(() => {
          if (window.XR8) return;
          showEarlyXrBanner(
            'Il motore AR non risulta disponibile. Ricarica, consenti la fotocamera e preferisci una rete stabile.'
          );
        }, 45000);
      });
    })();

    // GESTIONE BANNER PWA
    let deferredPrompt;
    let pwaBanner, installBtn, closeBtn, pwaMsg, progressRow, progressFill, progressLabel;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

    const setPwaProgress = (done, total) => {
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      if (progressFill) progressFill.style.width = pct + '%';
      if (progressLabel) progressLabel.innerText = pct + '%';
    };

    // Scarica davvero tutti i contenuti (immagini, audio, quiz) nella cache
    // offline: è l'unico "download" osservabile via JS. L'installazione nativa
    // (Add to Home Screen) è gestita interamente dal sistema operativo e non
    // espone alcun progresso alla pagina.
    const startOfflineDownload = () => {
      if (!window.PwaPrecache) return;
      installBtn.classList.add('hidden');
      closeBtn.classList.add('hidden');
      progressRow.classList.remove('hidden');
      setPwaProgress(0, 1);

      window.PwaPrecache.run((p) => setPwaProgress(p.done, p.total))
        .then((result) => {
          const okCount = result.total - result.failed.length;
          if (result.failed.length === 0) {
            pwaMsg.innerText = 'Contenuti del museo scaricati: ora disponibili anche offline.';
            progressRow.classList.add('hidden');
            setTimeout(() => pwaBanner.classList.add('hidden'), 2500);
          } else {
            pwaMsg.innerText = `Scaricati ${okCount}/${result.total} file. Alcuni contenuti non sono stati salvati (rete debole): riprova.`;
            installBtn.innerText = 'Riprova';
            installBtn.classList.remove('hidden');
            closeBtn.classList.remove('hidden');
          }
        })
        .catch(() => {
          pwaMsg.innerText = 'Download non riuscito. Riprova quando la rete è più stabile.';
          installBtn.innerText = 'Riprova';
          installBtn.classList.remove('hidden');
          closeBtn.classList.remove('hidden');
        });
    };

    // Sync automatico e silenzioso: quando l'app gira già come PWA installata
    // (standalone) non mostriamo il banner, ma se i contenuti non sono ancora
    // tutti in cache li scarichiamo comunque in background con una barra
    // discreta, senza richiedere alcun tap.
    const OFFLINE_SYNC_KEY = 'pwa_offline_synced_v1';

    const startAutoOfflineSync = () => {
      if (!window.PwaPrecache || window.PwaPrecache.isRunning()) return;
      if (localStorage.getItem(OFFLINE_SYNC_KEY) === 'true') return;

      const syncEl = document.getElementById('pwa-offline-sync');
      const syncFill = document.getElementById('pwa-offline-sync-fill');
      const syncLabel = document.getElementById('pwa-offline-sync-label');
      if (!syncEl) return;

      syncEl.classList.remove('hidden');
      syncLabel.innerText = 'Scaricamento contenuti offline…';

      window.PwaPrecache.run((p) => {
        const pct = p.total > 0 ? Math.round((p.done / p.total) * 100) : 0;
        syncFill.style.width = pct + '%';
      })
        .then((result) => {
          if (result.failed.length === 0) {
            localStorage.setItem(OFFLINE_SYNC_KEY, 'true');
            syncLabel.innerText = 'Contenuti offline pronti';
          } else {
            syncLabel.innerText = `Offline: ${result.total - result.failed.length}/${result.total} salvati`;
          }
          setTimeout(() => syncEl.classList.add('hidden'), 2000);
        })
        .catch(() => {
          syncLabel.innerText = 'Download offline non riuscito';
          setTimeout(() => syncEl.classList.add('hidden'), 2500);
        });
    };

    window.addEventListener('load', () => {
      // Inizializza elementi solo dopo il caricamento della pagina
      pwaBanner = document.getElementById('pwa-install-banner');
      installBtn = document.getElementById('pwa-install-btn');
      closeBtn = document.getElementById('pwa-close-btn');
      pwaMsg = document.getElementById('pwa-msg');
      progressRow = document.getElementById('pwa-progress-row');
      progressFill = document.getElementById('pwa-progress-fill');
      progressLabel = document.getElementById('pwa-progress-label');

      // Bind dell'evento chiusura
      closeBtn.onclick = () => {
        pwaBanner.classList.add('hidden');
        localStorage.setItem('pwa_dismissed', 'true');
      };

      // Bind del bottone principale: su Android avvia il prompt nativo e poi
      // il download reale; su iOS (nessun beforeinstallprompt) avvia subito
      // il download, perché "Aggiungi alla Home" resta un gesto manuale
      // nel foglio Condividi fuori dal nostro controllo.
      installBtn.onclick = () => {
        if (isIOS) {
          startOfflineDownload();
          return;
        }
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          deferredPrompt = null;
          if (choice.outcome === 'accepted') {
            startOfflineDownload();
          } else {
            pwaBanner.classList.add('hidden');
          }
        });
      };

      // App già installata: niente banner, solo il sync automatico in background.
      if (isStandalone) {
        setTimeout(() => {
          if (document.querySelector('.prompt-box-8w')) return;
          startAutoOfflineSync();
        }, 4000);
        return;
      }

      if (localStorage.getItem('pwa_dismissed') === 'true') return;

      setTimeout(() => {
        // Non sovrapporre al prompt camera di 8th Wall
        if (document.querySelector('.prompt-box-8w')) return;
        if (isIOS) {
          pwaMsg.innerText = "Tocca 'Condividi' e seleziona 'Aggiungi alla Home' per installare l'app, oppure scarica subito i contenuti per l'offline.";
          installBtn.innerText = 'Scarica offline';
          installBtn.classList.remove('hidden');
          pwaBanner.classList.remove('hidden');
        } else {
          pwaBanner.classList.remove('hidden');
        }
      }, 8000);
    });

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone && localStorage.getItem('pwa_dismissed') !== 'true') {
        if (pwaBanner) pwaBanner.classList.remove('hidden');
        if (installBtn) installBtn.classList.remove('hidden');
      }
    });

    // 8TH WALL: localizza prompt permessi (camera + motion) + nascondi PWA
    // Nota: questo script è in <head> → document.body non esiste ancora.
    const PROMPT_IT = {
      motion: "L'AR richiede l'accesso ai sensori di movimento del dispositivo",
      camera: "Tocca Consenti per accedere alla fotocamera e iniziare l'esperienza",
      continue: 'Continua',
      allow: 'Consenti',
      cancel: 'Annulla',
    }

    const DENIED_IT = {
      title: 'Permessi negati',
      body: 'Safari ha bloccato i sensori di movimento. Chiudi completamente Safari (dallo switcher app), riaprilo e torna a questa pagina: al prompt tocca Continua e poi Consenti.',
      bodyApple: "Hai bloccato l'accesso ai sensori di movimento. Chiudi completamente Safari e riapri questa pagina per riprovare.",
      refresh: 'Ho chiuso Safari — riprova',
      enableHeader: 'Abilitiamo i sensori di movimento',
    }

    let promptLocalizeBusy = false

    const translatePromptText = (raw) => {
      const t = (raw || '').replace(/\s+/g, ' ').trim()
      if (!t) return null
      if (/sensori di movimento|tocca consenti|fotocamera e iniziare/i.test(t)) return null
      if (/motion\s*sensors|device\s*motion|gyroscope|accelerometer/i.test(t)) return PROMPT_IT.motion
      if (/ar requires access/i.test(t)) return PROMPT_IT.motion
      if (/camera|fotocamera|permission|allow access|experience|esperienza/i.test(t)) return PROMPT_IT.camera
      return null
    }

    const localizeDeniedScreens = () => {
      const userPrompt = document.getElementById('userPromptError')
      if (userPrompt && !userPrompt.classList.contains('hidden')) {
        const h1 = userPrompt.querySelector('h1')
        const p = userPrompt.querySelector('p')
        const btn = userPrompt.querySelector('#reloadButton, button.main-button, button')
        if (h1 && /permission|denied|permessi/i.test(h1.textContent || '')) h1.textContent = DENIED_IT.title
        if (p && /motion|permission|movimento|permessi/i.test(p.textContent || '')) p.textContent = DENIED_IT.body
        if (btn && /refresh|reload|ricarica/i.test(btn.textContent || '')) btn.textContent = DENIED_IT.refresh
      }

      const appleDenied = document.getElementById('motionPermissionsErrorApple')
      if (appleDenied && !appleDenied.classList.contains('hidden')) {
        const h1 = appleDenied.querySelector('h1')
        const ps = appleDenied.querySelectorAll('p')
        if (h1) h1.textContent = DENIED_IT.title
        if (ps[0]) ps[0].textContent = DENIED_IT.bodyApple
        if (ps[1]) ps[1].textContent = "Chiudi l'app o il tab e aprilo di nuovo per riabilitare i sensori."
      }

      const appleHelp = document.getElementById('deviceMotionErrorApple')
      if (appleHelp && !appleHelp.classList.contains('hidden')) {
        const header = appleHelp.querySelector('.loading-error-header')
        if (header) header.textContent = DENIED_IT.enableHeader
      }
    }

    const localizeCameraPrompt = () => {
      if (promptLocalizeBusy) return
      localizeDeniedScreens()

      const promptBox = document.querySelector('.prompt-box-8w')
      const pwa = document.getElementById('pwa-install-banner')
      if (pwa && promptBox) pwa.classList.add('hidden')
      if (!promptBox) return

      promptLocalizeBusy = true
      try {
        const p = promptBox.querySelector('p')
        if (p) {
          const next = translatePromptText(p.textContent)
          if (next && p.textContent.trim() !== next) p.textContent = next
        }

        promptBox.querySelectorAll('button.prompt-button-8w, button').forEach((btn) => {
          const label = (btn.textContent || '').trim()
          if (!label) return
          if (/^(continua|consenti|annulla)$/i.test(label)) return
          if (btn.classList.contains('button-primary-8w') || /^continue$/i.test(label)) {
            const box = (promptBox.textContent || '')
            const it = /motion|sensor|movimento/i.test(box) || /^continue$/i.test(label)
              ? PROMPT_IT.continue
              : PROMPT_IT.allow
            if (label !== it) btn.textContent = it
          } else if (/^cancel$/i.test(label)) {
            btn.textContent = PROMPT_IT.cancel
          }
        })
      } finally {
        promptLocalizeBusy = false
      }
    }

    const startPromptLocalize = () => {
      const root = document.body
      if (!root) return
      const observer = new MutationObserver(() => {
        if (
          document.querySelector('.prompt-box-8w') ||
          document.querySelector('#userPromptError:not(.hidden)') ||
          document.querySelector('#motionPermissionsErrorApple:not(.hidden)') ||
          document.querySelector('#deviceMotionErrorApple:not(.hidden)')
        ) {
          localizeCameraPrompt()
        }
      })
      observer.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] })
      localizeCameraPrompt()
      let n = 0
      const tick = setInterval(() => {
        localizeCameraPrompt()
        if (++n > 60) clearInterval(tick)
      }, 300)
    }

    if (document.body) startPromptLocalize()
    else document.addEventListener('DOMContentLoaded', startPromptLocalize)
  </script>
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="slam"
    appKey="3BnxNE2RNShEkkTCf4TzDiMhNRy_2EsTEq3ZvhXbZg8bXtAT4"></script>
  <!-- Carica XRExtras ufficiale per gestire FullScreen e Permessi Camera -->
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet">
  <style>
    :root {
      --primary: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.3);
      --glass-blur: blur(12px);
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    .hidden {
      display: none !important;
      opacity: 0;
      pointer-events: none;
    }

    #ar-ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .ui-element {
      pointer-events: auto;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      color: var(--primary);
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, background 0.2s;
    }

    .ui-element:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.3);
    }

    /* Pin AR: tre dischi con profondità, respiro in scala */
    #ar-trigger-hotspot {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #ar-trigger-hotspot.hidden {
      display: none !important;
      pointer-events: none;
    }

    .ar-pin-head {
      position: absolute;
      width: 108px;
      height: 108px;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.38));
      animation: ar-pin-breath 2.2s ease-in-out infinite;
    }

    .ar-pin-disc {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .ar-pin-disc.core {
      width: 30%;
      height: 30%;
      background: radial-gradient(circle at 32% 28%, #ffffff 0%, #f4f4f4 52%, #cfcfcf 100%);
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.28),
        inset 0 2px 3px rgba(255, 255, 255, 0.95),
        inset 0 -3px 5px rgba(0, 0, 0, 0.16);
    }

    .ar-pin-disc.mid {
      width: 62%;
      height: 62%;
      background: radial-gradient(circle at 36% 30%, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.14) 72%);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.2),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
    }

    .ar-pin-disc.outer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 38% 32%, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.28) 58%, rgba(255, 255, 255, 0.16) 100%);
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    @keyframes ar-pin-breath {
      0%,
      100% {
        transform: translate(-50%, -50%) scale(0.88);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.14);
      }
    }

    /* Scan: 4 angoli + riga che scorre */
    #ar-scan-hud {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #ar-scan-hud.hidden {
      display: none !important;
    }

    .ar-scan-frame {
      position: relative;
      width: min(72vw, 300px);
      height: min(56vh, 420px);
    }

    .ar-scan-corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: #ffffff;
      border-style: solid;
      box-sizing: border-box;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
    }

    .ar-scan-corner.tl {
      top: 0;
      left: 0;
      border-width: 4px 0 0 4px;
      border-top-left-radius: 14px;
    }

    .ar-scan-corner.tr {
      top: 0;
      right: 0;
      border-width: 4px 4px 0 0;
      border-top-right-radius: 14px;
    }

    .ar-scan-corner.bl {
      bottom: 0;
      left: 0;
      border-width: 0 0 4px 4px;
      border-bottom-left-radius: 14px;
    }

    .ar-scan-corner.br {
      bottom: 0;
      right: 0;
      border-width: 0 4px 4px 0;
      border-bottom-right-radius: 14px;
    }

    .ar-scan-line {
      position: absolute;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 16%,
        #ffffff 50%,
        rgba(255, 255, 255, 0.4) 84%,
        transparent 100%
      );
      box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.5);
      animation: ar-scan-line 2s ease-in-out infinite alternate;
    }

    @keyframes ar-scan-line {
      from {
        top: 8%;
      }
      to {
        top: 88%;
      }
    }

    .material-symbols-rounded {
      font-size: 26px;
    }

    /* --- 8TH WALL LOADING + CAMERA PERMISSIONS --- */
    /* Non forzare display: altrimenti la loading non si nasconde più e l'AR resta bloccata. */
    #loadBackground,
    .xrextras-loading-screen,
    #requestingCameraPermissions,
    #loading-screen {
      background: #f7f4ef !important;
      background-color: #f7f4ef !important;
      font-family: 'Inter', sans-serif !important;
      color: #141419 !important;
    }

    #requestingCameraPermissions,
    #loading-screen {
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
      z-index: 10000 !important;
      padding: 24px !important;
      box-sizing: border-box !important;
    }

    /* Logo museo — solo mentre la schermata è visibile */
    #requestingCameraPermissions:not([style*="display: none"]):not([style*="display:none"])::before,
    #loading-screen:not([style*="display: none"]):not([style*="display:none"])::before {
      content: "" !important;
      display: block !important;
      width: min(280px, 70vw) !important;
      height: 120px !important;
      background-image: url('./image/ba_va_vettoriale_payoff_oro_nero.png') !important;
      background-size: contain !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      margin: 0 auto 28px !important;
      order: -2 !important;
      flex-shrink: 0 !important;
    }

    /* Copy sotto il logo (schermata richiesta permessi) */
    #requestingCameraPermissions:not([style*="display: none"]):not([style*="display:none"])::after {
      content: "Accesso all'esperienza AR\A\A Tocca Consenti per attivare la fotocamera" !important;
      white-space: pre-wrap !important;
      display: block !important;
      font-size: 1.05rem !important;
      line-height: 1.55 !important;
      font-weight: 500 !important;
      color: #141419 !important;
      max-width: 20rem !important;
      margin: 0 auto 24px !important;
      order: -1 !important;
    }

    /* Nasconde icone/testi nativi 8th Wall, ma NON il prompt box */
    #requestingCameraIcon,
    #loadImage,
    .permission-icon,
    .prompt-image,
    #requestingCameraPermissions > img:not(.poweredby-img),
    #loading-screen > img:not(.poweredby-img) {
      display: none !important;
    }

    #requestingCameraPermissions .poweredby-img,
    #loading-screen .poweredby-img {
      display: block !important;
      opacity: 0.45 !important;
      height: auto !important;
      width: 96px !important;
      margin-top: 28px !important;
      order: 2 !important;
    }

    /* Prompt iOS/Android — testo e bottoni leggibili su sfondo chiaro */
    .prompt-box-8w {
      background-color: #ffffff !important;
      color: #141419 !important;
      border-radius: 20px !important;
      box-shadow: 0 12px 40px rgba(20, 20, 25, 0.14) !important;
      padding: 28px 22px 20px !important;
      z-index: 10001 !important;
      max-width: min(360px, calc(100vw - 40px)) !important;
      width: auto !important;
      box-sizing: border-box !important;
      font-family: 'Inter', sans-serif !important;
    }

    .prompt-box-8w > p {
      color: #141419 !important;
      font-size: 1.02rem !important;
      line-height: 1.5 !important;
      opacity: 1 !important;
      visibility: visible !important;
      text-align: center !important;
      margin: 0 0 8px !important;
    }

    .prompt-box-8w .prompt-button-8w,
    .prompt-box-8w button {
      border-radius: 12px !important;
      font-weight: 600 !important;
      font-size: 0.95rem !important;
      min-height: 44px !important;
      padding: 10px 18px !important;
      border: none !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .button-primary-8w,
    .prompt-box-8w .button-primary-8w {
      background-color: #c4a45d !important;
      color: #141419 !important;
    }

    .prompt-box-8w .prompt-button-8w:not(.button-primary-8w),
    .prompt-box-8w button:not(.button-primary-8w) {
      background-color: #e8e4dc !important;
      color: #141419 !important;
    }

    /* --- XRExtras: permessi negati / motion error (allineati al brand) --- */
    .permission-error.absolute-fill:not(.hidden),
    #deviceMotionErrorApple:not(.hidden) {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
      background: #f7f4ef !important;
      color: #141419 !important;
      font-family: 'Inter', sans-serif !important;
      padding: 32px 24px !important;
      box-sizing: border-box !important;
      z-index: 10050 !important;
    }

    #userPromptError:not(.hidden)::before,
    #motionPermissionsErrorApple:not(.hidden)::before,
    #deviceMotionErrorApple:not(.hidden)::before {
      content: "" !important;
      display: block !important;
      width: min(240px, 65vw) !important;
      height: 100px !important;
      background-image: url('./image/ba_va_vettoriale_payoff_oro_nero.png') !important;
      background-size: contain !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      margin: 0 auto 28px !important;
    }

    .permission-error > h1 {
      font-size: 1.35rem !important;
      font-weight: 600 !important;
      color: #141419 !important;
      margin: 0 0 12px !important;
      letter-spacing: -0.01em !important;
      line-height: 1.3 !important;
    }

    .permission-error > p {
      font-size: 1rem !important;
      font-weight: 500 !important;
      color: #3a3a42 !important;
      max-width: 22rem !important;
      line-height: 1.55 !important;
      margin: 0 auto 8px !important;
    }

    .permission-error .main-button,
    #reloadButton.main-button {
      border: none !important;
      outline: none !important;
      background-color: #c4a45d !important;
      color: #141419 !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 1rem !important;
      font-weight: 600 !important;
      display: inline-block !important;
      margin-top: 28px !important;
      padding: 12px 28px !important;
      border-radius: 12px !important;
      box-shadow: 0 4px 16px rgba(196, 164, 93, 0.35) !important;
    }

    #deviceMotionErrorApple .loading-error-header {
      color: #141419 !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 1.25rem !important;
      font-weight: 600 !important;
      margin-bottom: 16px !important;
    }

    #deviceMotionErrorApple .loading-error-instructions {
      color: #3a3a42 !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 0.95rem !important;
      line-height: 1.6 !important;
      text-align: left !important;
      max-width: 22rem !important;
      margin: 0 auto !important;
      padding-left: 1.25rem !important;
    }

    #deviceMotionErrorApple .loading-error-instructions .highlight {
      color: #c4a45d !important;
      font-weight: 600 !important;
    }

    #deviceMotionErrorApple .loading-error-footer {
      color: #3a3a42 !important;
    }

    /* ------------------------------------------------------------- */

    @keyframes loading-pulse {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(0.98);
        opacity: 0.9;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.02);
        opacity: 1;
      }
    }

    .btn-text {
      font-weight: 600;
      font-size: 1rem;
    }

    .top-bar {
      position: absolute;
      top: calc(25px + env(safe-area-inset-top, 0px));
      right: 25px;
      display: flex;
      gap: 15px;
    }

    .side-controls {
      position: absolute;
      top: calc(95px + env(safe-area-inset-top, 0px));
      right: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* QUIZ STYLES */
    #quiz-panel h3 {
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 20px;
      font-weight: 600;
      line-height: 1.4;
    }

    .quiz-option {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
      text-align: left;
      color: rgba(255, 255, 255, 0.9);
    }

    .quiz-option:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .quiz-option.correct {
      background: rgba(46, 204, 113, 0.3) !important;
      border-color: rgba(46, 204, 113, 0.6) !important;
      color: #2ecc71;
    }

    .quiz-option.wrong {
      background: rgba(231, 76, 60, 0.3) !important;
      border-color: rgba(231, 76, 60, 0.6) !important;
      color: #e74c3c;
    }

    .quiz-option.disabled {
      pointer-events: none;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      font-size: 1.5rem;
    }

    #nav-left-btn {
      left: 20px;
    }

    #nav-right-btn {
      right: 20px;
    }

    /* INFO BOTTOM SHEET */
    #info-bottomsheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 75vh;
      /* Limite altezza al 75% dello schermo */
      display: flex;
      flex-direction: column;
      background: rgba(20, 20, 25, 0.85);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-top: 1px solid var(--glass-border);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 25px 25px 30px 25px;
      color: white;
      pointer-events: auto;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      z-index: 30;
      box-sizing: border-box;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    #info-bottomsheet.hidden {
      display: flex !important;
      opacity: 0;
      pointer-events: none;
      transform: translateY(100%);
    }

    .sheet-handle {
      width: 45px;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      margin: -10px auto 20px auto;
      flex-shrink: 0;
    }

    .sheet-content {
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 8px;
      /* Spazio per la scrollbar */
      margin-bottom: 20px;
    }

    /* Scrollbar personalizzata premium */
    .sheet-content::-webkit-scrollbar {
      width: 5px;
    }

    .sheet-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .sheet-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    #info-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 1.05rem;
      line-height: 1.65;
      text-align: left;
      margin: 0;
    }

    #close-sheet-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 14px 0;
      width: 100%;
      border-radius: 15px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    #close-sheet-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    /* CUSTOM AUDIO PLAYER */
    #custom-audio-player {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 400px;
      background: rgba(20, 20, 25, 0.7);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 15px 20px;
      color: white;
      pointer-events: auto;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      z-index: 20;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #custom-audio-player.hidden {
      display: block !important;
      /* overrides .hidden display:none to allow transition */
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 20px);
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    #play-pause-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    #play-pause-btn .material-symbols-rounded {
      font-size: 34px;
    }

    #play-pause-btn:active {
      transform: scale(0.9);
    }

    #progress-container {
      flex-grow: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    #progress-bar {
      height: 100%;
      background: #00d2ff;
      width: 0%;
      border-radius: 3px;
      pointer-events: none;
    }

    #time-display {
      font-size: 0.8rem;
      font-family: monospace;
      opacity: 0.8;
      white-space: nowrap;
    }

    #close-player-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.6;
      padding: 0;
    }

    /* PWA BANNER STYLES — fondo scuro leggibile anche su loading bianco */
    #pwa-install-banner {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 20px;
      right: 20px;
      background: rgba(20, 20, 25, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 18px;
      color: #ffffff;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      animation: slide-up 0.5s ease-out;
    }

    @keyframes slide-up {
      from {
        transform: translateY(100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .pwa-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pwa-icon-mini {
      width: 44px;
      height: 44px;
      border-radius: 8px;
    }

    .pwa-text {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.4;
      color: #ffffff;
    }

    .pwa-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .pwa-btn {
      padding: 8px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .pwa-btn-primary {
      background: #c4a45d;
      color: black;
    }

    .pwa-btn-secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .pwa-progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pwa-progress-track {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .pwa-progress-fill {
      height: 100%;
      width: 0%;
      background: #c4a45d;
      transition: width 0.2s ease;
    }

    .pwa-progress-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #ffffff;
      min-width: 34px;
      text-align: right;
    }

    /* Barra discreta per il sync offline automatico in standalone (no banner, no bottoni) */
    #pwa-offline-sync {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0;
      right: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(20, 20, 25, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.4s ease;
    }

    #pwa-offline-sync-track {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    #pwa-offline-sync-fill {
      height: 100%;
      width: 0%;
      background: #c4a45d;
      transition: width 0.2s ease;
    }

    #pwa-offline-sync-label {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
    }

    /* ERROR RECOVERY BANNER (stesso linguaggio del PWA banner) */
    #error-recovery-banner {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px;
      color: white;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: slide-up 0.5s ease-out;
    }

    #error-recovery-banner.hidden {
      display: none !important;
    }

    #error-recovery-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #c4a45d;
      margin-bottom: 4px;
    }

    #error-recovery-msg {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.45;
    }

    #recovery-loader {
      position: fixed;
      inset: 0;
      z-index: 10001;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(10, 10, 14, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      padding: 24px;
      text-align: center;
    }

    #recovery-loader.hidden {
      display: none !important;
    }

    .recovery-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #c4a45d;
      border-radius: 50%;
      animation: recovery-spin 0.8s linear infinite;
    }

    @keyframes recovery-spin {
      to { transform: rotate(360deg); }
    }

    #recovery-loader-text {
      font-size: 0.95rem;
      font-weight: 500;
      max-width: 280px;
      line-height: 1.4;
    }

    body.mbv-recovery-blocked #ar-ui-overlay {
      pointer-events: none;
      opacity: 0.55;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- ERROR RECOVERY BANNER -->
  <div id="error-recovery-banner" class="hidden">
    <div class="pwa-header" style="align-items:flex-start;">
      <div>
        <div id="error-recovery-title">Avviso</div>
        <div id="error-recovery-msg" class="pwa-text">Messaggio</div>
      </div>
    </div>
    <div class="pwa-actions">
      <button id="error-reload-btn" class="pwa-btn pwa-btn-primary">Ricarica</button>
      <button id="error-close-btn" class="pwa-btn pwa-btn-secondary">Chiudi</button>
    </div>
  </div>

  <div id="recovery-loader" class="hidden">
    <div class="recovery-spinner" aria-hidden="true"></div>
    <div id="recovery-loader-text">Stiamo ripristinando la visita…</div>
  </div>

  <!-- PWA INSTALL BANNER -->
  <div id="pwa-install-banner" class="hidden">
    <div class="pwa-header">
      <img src="./asset/icons/pwa-icon-192.png" class="pwa-icon-mini">
      <div id="pwa-msg" class="pwa-text">Installa l'app del Museo per un'esperienza migliore e accesso offline.</div>
    </div>
    <div id="pwa-progress-row" class="pwa-progress-row hidden">
      <div class="pwa-progress-track">
        <div id="pwa-progress-fill" class="pwa-progress-fill"></div>
      </div>
      <span id="pwa-progress-label" class="pwa-progress-label">0%</span>
    </div>
    <div class="pwa-actions">
      <button id="pwa-install-btn" class="pwa-btn pwa-btn-primary hidden">Installa</button>
      <button id="pwa-close-btn" class="pwa-btn pwa-btn-secondary">Chiudi</button>
    </div>
  </div>

  <!-- SYNC OFFLINE AUTOMATICO (app già installata, aperta in standalone) -->
  <div id="pwa-offline-sync" class="hidden">
    <div id="pwa-offline-sync-track">
      <div id="pwa-offline-sync-fill"></div>
    </div>
    <span id="pwa-offline-sync-label">Scaricamento contenuti offline…</span>

  <div id="ar-scan-hud" class="hidden">
    <div class="ar-scan-frame">
      <span class="ar-scan-corner tl"></span>
      <span class="ar-scan-corner tr"></span>
      <span class="ar-scan-corner bl"></span>
      <span class="ar-scan-corner br"></span>
      <div class="ar-scan-line"></div>
    </div>
  </div>

  <div id="ar-trigger-hotspot" class="hidden">
    <div class="ar-pin-head">
      <span class="ar-pin-disc outer"></span>
      <span class="ar-pin-disc mid"></span>
      <span class="ar-pin-disc core"></span>
    </div>
  </div>

  <canvas id="camerafeed"></canvas>
  <!-- trigger-ui: hotspot-v23 -->
  <div id="ar-ui-overlay" class="hidden">
    <div class="top-bar">
      <div id="lang-btn" class="ui-element btn-text">IT</div>
      <div id="close-btn" class="ui-element"><span class="material-symbols-rounded">close</span></div>
    </div>

    <div class="side-controls">
      <div id="audio-btn" class="ui-element"><span class="material-symbols-rounded">volume_off</span></div>
      <div id="info-btn" class="ui-element"><span class="material-symbols-rounded">info</span></div>
      <div id="quiz-btn" class="ui-element hidden"><span class="material-symbols-rounded">help</span></div>
    </div>

    <div id="nav-left-btn" class="ui-element nav-arrow"><span class="material-symbols-rounded">chevron_left</span></div>
    <div id="nav-right-btn" class="ui-element nav-arrow"><span class="material-symbols-rounded">chevron_right</span>
    </div>

    <!-- INFO BOTTOM SHEET -->
    <div id="info-bottomsheet" class="hidden">
      <div class="sheet-handle"></div>

      <!-- STORIA -->
      <div id="info-panel" class="sheet-content">
        <p id="info-text">Testo placeholder</p>
      </div>

      <!-- QUIZ -->
      <div id="quiz-panel" class="sheet-content hidden">
        <h3 id="quiz-question">Domanda</h3>
        <div id="quiz-options">
          <!-- Bottoni opzioni iniettati via JS -->
        </div>
      </div>

      <button id="close-sheet-btn">Chiudi</button>
    </div>

    <!-- AUDIO PLAYER PANEL -->
    <div id="custom-audio-player" class="hidden">
      <div class="player-controls">
        <button id="play-pause-btn"><span class="material-symbols-rounded">play_arrow</span></button>
        <div id="progress-container">
          <div id="progress-bar"></div>
        </div>
        <span id="time-display">0:00 / 0:00</span>
        <button id="close-player-btn"><span class="material-symbols-rounded">close</span></button>
      </div>
    </div>
  </div>

  <audio id="ar-audio-player" class="hidden"></audio>

  <script src="bundle.js?v=24"></script>
</body>
